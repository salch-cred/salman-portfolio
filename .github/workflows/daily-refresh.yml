# Once a day: pull the latest Hermes Agent credits, rebuild the resume PDF,
# commit any change, then redeploy Vercel and Cloudflare.
name: Daily refresh

on:
  schedule:
    - cron: '30 21 * * *' # 03:00 in India
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch GitHub data
        env:
          # A read-only token is optional. The built-in one can read public data.
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git show HEAD:data/snapshot.json > /tmp/before.json
          node scripts/snapshot.ts

      - name: Refuse a partial fetch
        run: |
          node -e '
            const before = require("/tmp/before.json").totals;
            const after = require("./data/snapshot.json").totals;
            const dropped = Object.keys(before).filter((k) => after[k] < before[k]);
            if (dropped.length) {
              console.error("Counts went down, so this fetch is probably incomplete:", dropped.join(", "));
              process.exit(1);
            }
            console.log(JSON.stringify(after));
          '

      - run: node scripts/build-resume.ts

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- data public; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new credits today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git commit -m "Daily refresh of Hermes credits"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::warning::VERCEL_TOKEN is not set, skipping Vercel."; exit 0; fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Deploy to Cloudflare
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set, skipping Cloudflare."; exit 0; fi
          npm run cf:deploy
